<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg">
  <title>Thanks for visiting</title>
  <defs>
    <clipPath id="round"><rect width="1000" height="180" rx="16"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c3a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="orbA"><stop offset="0" stop-color="#00f7ff" stop-opacity=".3"/><stop offset="1" stop-color="#00f7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#a371f7" stop-opacity=".35"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22304f" stroke-width="1"/>
    </pattern>

    <clipPath id="typeclip">
      <rect x="146" y="76" height="34" width="0">
        <animate attributeName="width" values="0;708;708;0" keyTimes="0;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="1000" height="180" fill="url(#bg)"/>

    <!-- Moving grid -->
    <g>
      <rect x="0" y="-40" width="1000" height="260" fill="url(#grid)" opacity=".7"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 40" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- Glowing orbs -->
    <circle cx="140" cy="140" r="140" fill="url(#orbA)">
      <animate attributeName="r" values="120;170;120" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="30" r="150" fill="url(#orbB)">
      <animate attributeName="r" values="170;120;170" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Binary / code rain -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#00f7ff" opacity=".22">
      <g><text x="40" y="0"><tspan x="40" dy="16">1</tspan><tspan x="40" dy="16">0</tspan><tspan x="40" dy="16">1</tspan><tspan x="40" dy="16">{</tspan><tspan x="40" dy="16">0</tspan><tspan x="40" dy="16">1</tspan></text>
        <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 200" dur="6s" begin="-2s" repeatCount="indefinite"/></g>
      <g><text x="130" y="0"><tspan x="130" dy="16">0</tspan><tspan x="130" dy="16">1</tspan><tspan x="130" dy="16">&lt;</tspan><tspan x="130" dy="16">0</tspan><tspan x="130" dy="16">1</tspan><tspan x="130" dy="16">0</tspan></text>
        <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 200" dur="8s" begin="-5s" repeatCount="indefinite"/></g>
      <g><text x="250" y="0"><tspan x="250" dy="16">1</tspan><tspan x="250" dy="16">1</tspan><tspan x="250" dy="16">0</tspan><tspan x="250" dy="16">;</tspan><tspan x="250" dy="16">1</tspan><tspan x="250" dy="16">0</tspan></text>
        <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 200" dur="7s" begin="-1s" repeatCount="indefinite"/></g>
      <g><text x="380" y="0"><tspan x="380" dy="16">0</tspan><tspan x="380" dy="16">}</tspan><tspan x="380" dy="16">1</tspan><tspan x="380" dy="16">0</tspan><tspan x="380" dy="16">1</tspan><tspan x="380" dy="16">1</tspan></text>
        <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 200" dur="9s" begin="-6s" repeatCount="indefinite"/></g>
      <g><text x="620" y="0"><tspan x="620" dy="16">1</tspan><tspan x="620" dy="16">0</tspan><tspan x="620" dy="16">&gt;</tspan><tspan x="620" dy="16">1</tspan><tspan x="620" dy="16">0</tspan><tspan x="620" dy="16">0</tspan></text>
        <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 200" dur="7.5s" begin="-3s" repeatCount="indefinite"/></g>
      <g><text x="750" y="0"><tspan x="750" dy="16">0</tspan><tspan x="750" dy="16">(</tspan><tspan x="750" dy="16">1</tspan><tspan x="750" dy="16">0</tspan><tspan x="750" dy="16">)</tspan><tspan x="750" dy="16">1</tspan></text>
        <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 200" dur="6.5s" begin="-4s" repeatCount="indefinite"/></g>
      <g><text x="870" y="0"><tspan x="870" dy="16">1</tspan><tspan x="870" dy="16">0</tspan><tspan x="870" dy="16">1</tspan><tspan x="870" dy="16">/</tspan><tspan x="870" dy="16">0</tspan><tspan x="870" dy="16">1</tspan></text>
        <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 200" dur="8.5s" begin="-7s" repeatCount="indefinite"/></g>
      <g><text x="960" y="0"><tspan x="960" dy="16">0</tspan><tspan x="960" dy="16">1</tspan><tspan x="960" dy="16">1</tspan><tspan x="960" dy="16">0</tspan><tspan x="960" dy="16">;</tspan><tspan x="960" dy="16">1</tspan></text>
        <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 200" dur="7s" begin="-2.5s" repeatCount="indefinite"/></g>
    </g>

    <!-- Scan line -->
    <rect x="0" y="0" width="1000" height="2" fill="#00f7ff" opacity=".25">
      <animate attributeName="y" from="-4" to="184" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Floating code symbols -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="bold">
      <text x="70" y="100" fill="#00f7ff" opacity=".5">&lt;/&gt;
        <animate attributeName="y" values="100;86;100" dur="4s" repeatCount="indefinite"/></text>
      <text x="885" y="110" fill="#a371f7" opacity=".55">{ }
        <animate attributeName="y" values="110;96;110" dur="5s" repeatCount="indefinite"/></text>
      <text x="930" y="60" fill="#00f7ff" opacity=".45">=&gt;
        <animate attributeName="y" values="60;46;60" dur="3.5s" repeatCount="indefinite"/></text>
    </g>

    <!-- Terminal line -->
    <text x="500" y="52" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#7ee787" opacity="0">
      kasun@dev:~$ echo "Thank you for visiting!"
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- Typing message -->
    <g clip-path="url(#typeclip)">
      <text x="146" y="100" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#e6edf3"
            textLength="708" lengthAdjust="spacing">Thanks for visiting! Let's build something awesome together.</text>
    </g>
    <rect y="78" width="3" height="28" fill="#00f7ff">
      <animate attributeName="x" values="146;854;854;146" keyTimes="0;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated waves -->
    <g>
      <path d="M0 150 Q125 120 250 150 T500 150 T750 150 T1000 150 T1250 150 T1500 150 T1750 150 T2000 150 V180 H0 Z" fill="#a371f7" opacity=".25"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M-500 160 Q-375 134 -250 160 T0 160 T250 160 T500 160 T750 160 T1000 160 T1250 160 T1500 160 V180 H-500 Z" fill="#00f7ff" opacity=".18"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="500 0" dur="13s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="998" height="178" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
